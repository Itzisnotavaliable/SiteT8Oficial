<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time 08</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="login-container">

    <div class="login-box">

      <h1>TIME 08</h1>

      <h2>Entrar</h2>

      <input
        type="text"
        id="usuario"
        placeholder="Usuário"
      >

      <input
        type="password"
        id="senha"
        placeholder="Senha"
      >

      <button onclick="entrar()">
        Entrar
      </button>

      <p id="erro"></p>

      <div class="aviso">
        Não é possível criar novas contas.
        Esta experiência é privada e exclusiva aos membros.
      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
