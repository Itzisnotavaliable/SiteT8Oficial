<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Catálogo - Time 08</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="catalogo-body">

  <!-- BARRA SUPERIOR -->
  <header class="navbar">

    <h1 class="logo">TIME 08</h1>

    <nav>
      <a href="catalogo.html">Catálogo</a>

      <a href="faq.html">
        Perguntas Frequentes
      </a>

      <a href="tierlist.html">
        Tier List
      </a>

      <a href="index.html">
        Sair
      </a>
    </nav>

  </header>


  <!-- CONTEÚDO PRINCIPAL -->
  <main>

    <!-- DESTAQUE -->
    <section class="destaque">

      <div class="destaque-conteudo">

        <h2>
          Bem-vindo ao catálogo
        </h2>

        <p>
          Explore os filmes, projetos e produções do Time 08.
        </p>

      </div>

    </section>


    <!-- CATÁLOGO -->
    <section class="catalogo-section">

      <h2>
        Filmes
      </h2>

      <!--
        Os pôsteres serão colocados aqui
        automaticamente pelo catalogo.js
      -->

      <div
        class="cards"
        id="cards"
      >
      </div>

    </section>

  </main>


  <!-- MODAL DE DETALHES -->
  <div
    class="modal"
    id="modal"
  >

    <div class="modal-conteudo">

      <!-- BOTÃO FECHAR -->
      <button
        class="fechar-modal"
        onclick="fecharDetalhes()"
      >
        ×
      </button>


      <!-- METADE ESQUERDA: PÔSTER -->
      <div class="modal-poster">

        <img
          id="modalPoster"
          src=""
          alt="Pôster do filme"
        >

      </div>


      <!-- METADE DIREITA: INFORMAÇÕES -->
      <div class="modal-informacoes">

        <h1 id="modalTitulo">
          Título
        </h1>

        <p id="modalSinopse">
          Sinopse
        </p>

        <p id="modalAno">
          Ano de lançamento
        </p>

        <p id="modalElenco">
          Elenco
        </p>

      </div>

    </div>

  </div>


  <!-- JAVASCRIPT -->

  <!--
    filmes.js precisa vir primeiro,
    pois contém a lista de filmes
  -->
  <script src="filmes.js"></script>

  <!--
    catalogo.js usa os dados
    presentes em filmes.js
  -->
  <script src="catalogo.js"></script>

</body>

</html>
